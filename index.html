<body>
<h1>Kinetic Duo · Adaptive Fitness Prototype</h1>
<div class="phone"><div class="scr"><div class="toast" id="toast"></div><div class="view" id="view"></div>
<div class="nav" id="nav"></div></div></div>
<p class="sm" style="text-align:center;max-width:380px">Try the Coach tab: “Stuck at work till 9pm, exhausted” · “I only have 25 min” · “Getting home at 1:30 AM” · “I want to rest today” · “40 min workout, solo” · Tap 🎙️ in the chat box and speak: “home at 9pm, tired”, or say “start workout”, “pause”</p>

<script>
const $=id=>document.getElementById(id),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EX=[{n:'Back Squat',m:15,c:1,p:9},{n:'Romanian Deadlift',m:12,c:1,p:9},{n:'Reformer Lunges',m:10,c:0,p:3},{n:'Core Circuit',m:8,c:0,p:2},{n:'Band Hip Thrust',m:8,c:0,p:1},{n:'Kettlebell Swings',m:7,c:0,p:0}];
const mk=(lbl,type,kept,pruned,slot,msg)=>({lbl,type,kept,pruned,slot,msg,dur:kept.reduce((a,e)=>a+e.m,0),name:type=='rest'?'Intentional Rest Day':type=='shift'?'Lower Body · moved':'Lower Body Reformer & Core'});
const S={tab:'coach',vers:[mk('v0','full',EX,[],null,'')],act:0,commit:0,turns:0,today:'plan',onb:0,profile:{},msgs:[{r:'c',t:"Hi, I'm Kinetic. Before we plan anything, two quick questions so I can tailor everything to you.",ob:1},{r:'c',t:"How would you describe your gym experience?",ob:1}],
 slot:1,rsvpMe:0,rsvpAlex:0,live:1,eq:[1,0,1,1],left:3600,run:0,kcal:[280,260],solo:0,hold:0,esc:0,done:0,voice:0,spoken:1,mic:0,micErr:'',viaVoice:0,cday:2,escCat:'',planOpen:0};
const SLOTS=[['Tue','7:00 AM'],['Thu','6:30 PM'],['Sat','9:00 AM']];

const NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60};
function norm(t){let s=t.toLowerCase().replace(/\b([ap])\.\s?m\.?/g,'$1m').replace(/o'clock/g,'').replace(/\bhalf an hour\b/g,'30 minutes').replace(/\ban hour\b/g,'60 minutes');
 s=s.replace(/\b(twenty|thirty|forty|fifty|sixty)[\s-](one|two|three|four|five|six|seven|eight|nine)\b/g,(m,a,b)=>NUM[a]+NUM[b]);
 s=s.replace(/\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|thirty|forty|fifty|sixty)\b/g,m=>NUM[m]);
 return s.replace(/\b(\d{1,2})\s(\d{2})\s*(am|pm)\b/g,'$1:$2 $3')}
const fmt=h=>{const x=Math.floor(h),m=Math.round((h-x)*60);return((x%12)||12)+(m?':'+String(m).padStart(2,'0'):'')+(x<12?' AM':' PM')};
function analyze(t){const s=norm(t);let h=null;for(const t of s.matchAll(/\b(\d{1,2})(?::([0-5]\d))?\s*(am|pm)?\b/g)){if(!t[2]&&!t[3])continue;const x=+t[1],f=(+t[2]||0)/60;if(t[3]){if(x>=1&&x<=12)h=x%12+(t[3]=='pm'?12:0)+f}else if(x<=23)h=(x>=1&&x<=11?x+12:x)+f}
 let mins=null;const mn=s.match(/\b(\d{1,3})\s*(?:min|mins|minutes)\b/),hr=s.match(/\b(\d(?:\.\d)?)\s*(?:hours?|hrs?)\b/);
 if(mn)mins=+mn[1];else if(hr)mins=Math.round(+hr[1]*60);else if(/\bhalf an hour\b/.test(s))mins=30;
 const rest=/\b(rest|skip|day off|no workout)\b/.test(s),stress=/\b(stress\w*|deadlines?|overwhelm\w*|swamped|slammed|meetings?|overrun|busy|work(?!\s*out)|working(?!\s*out)|late)\b/.test(s),tired=/\b(tired|exhausted|sore|drained|wiped|fatigue\w*|sleepy)\b/.test(s),solo=/\b(solo|alone|by myself|on my own|individual(ly)?)\b/.test(s),usual=/\b(like usual|as usual|as planned|as scheduled|same as (always|usual)|full (workout|session|plan)|regular (workout|session|plan)|normal (workout|session|plan))\b/.test(s);
 return{h,mins,rest,stress,tired,solo,usual,signal:h!=null||mins!=null||rest||stress||tired||solo||usual}}
function propose(a){const n=S.vers.length,L='v'+n;
 if(a.rest)return mk(L,'rest',[],EX,{d:'Tomorrow',t:'7:00 AM'},"Totally fine, rest is part of the plan. Today is logged as an Intentional Rest Day, so your streak stays safe. The full session moves to tomorrow 7:00 AM.");
 if(a.h!=null&&(a.h>=23||a.h<5))return mk(L,'shift',EX,[],{d:'Tomorrow',t:'6:30 PM'},"Training at "+fmt(a.h)+" would cut into your sleep, so I've moved the full 60-min session to tomorrow 6:30 PM. Nothing is lost.");
 let b=a.mins??(a.h!=null?(a.h<=19?60:a.h<=20?45:a.h<=21?30:20):60);const why=[];
 if(a.mins!=null)why.push('the '+a.mins+' min you have');else if(a.h!=null&&b<60)why.push('a ~'+fmt(a.h)+' start');
 if(a.stress){b-=10;why.push('work stress')}if(a.tired){b-=10;why.push('low energy')}
 const raw=b;b=Math.max(15,Math.min(60,b));
 const kept=[],pr=[];let used=0;[...EX].sort((x,y)=>y.p-x.p).forEach(e=>{if(used+e.m<=b){kept.push(e);used+=e.m}else pr.push(e)});
 kept.sort((x,y)=>EX.indexOf(x)-EX.indexOf(y));const big=kept.filter(e=>e.c).map(e=>e.n);
 const msg=pr.length?`Adapted to ${used} min${why.length?' for '+why.join(' + '):''}. Keeping ${kept.map(e=>e.n).join(', ')}.${big.length?` ${big.join(' and ')} ${big.length>1?'stay as priority lifts':'stays as your priority lift'}.`:''} ${pr.map(e=>e.n).join(', ')} move${pr.length==1?'s':''} to tomorrow 7:00 AM.${raw<15?' 15 min is the shortest useful session I build.':''}`:"You have room for the full 60 min, so the plan stays as is.";
 const pp=mk(L,pr.length?'compressed':'full',kept,pr,pr.length?{d:'Tomorrow',t:'7:00 AM'}:null,msg);pp.at=a.h!=null?fmt(a.h):null;return pp}
const MED=/\b(pain|pains|painful|hurt|hurts|hurting|ach(e|es|ing)|backache|headaches?|injur\w+|sprain\w*|strain(ed)?|joints?|knees?|sciatica|tendon\w*|fractur\w+|swollen|swelling|numb|numbness|dizz\w+|faint(ing)?|chest tightness|palpitations?|breathless|short of breath|nause\w+|vomit\w*|fever\w*|sick|ill|unwell|flu|cough\w*|infection|bleeding|rash|migraines?|anxiety|anxious|panic\w*|depress\w+|mental health|therapy|suicid\w+|self[- ]harm|hopeless|medications?|medicines?(?! ball)|pills?|dosage|prescriptions?|painkillers?|steroids?|antibiotics?|supplements?|pregnan\w+|diagnos\w+|doctor|asthma|diabetes|blood pressure)\b/i;
const THIRD=/\b(friends?|colleagues?|co-?workers?|boss|manager|wife|husband|mom|dad|mother|father|brother|sister|kids?|son|daughter|partner|neighbou?rs?|roommate|he|she|they|him|her|someone|somebody|people|everyone|alex|teammates?|classmates?|cousin|uncle|aunt|grand\w+)\b/i,SELF=/\b(i|i'm|im|i've|ive|me|myself)\b/i,NEG=/\b(?:no|not|without|never|isn'?t|aren'?t|don'?t have|\w+n't)\b(?:\W+\w+){0,1}\W*$/i;
function selfMed(t){return t.split(/[,;.!?]|\b(?:but|and|so|although|while)\b/i).some(c=>{const m=MED.exec(c);if(!m)return 0;if(THIRD.test(c)&&!SELF.test(c))return 0;return!NEG.test(c.slice(0,m.index))})}
const CRISIS=/\b(suicid\w+|self[- ]harm|hopeless|kill myself|want to die|end it all)\b/i;
const PII=[/[^\s@]+@[^\s@]+\.[a-z]{2,}/i,/\d(?:[ -]?\d){9,}/,/\b[A-Z]{5}\d{4}[A-Z]\b/,/\b(cvv|cvc|card number|credit card|debit card|upi|otp|password|passcode|aadhaar|aadhar|passport|ssn|social security|bank account|ifsc|iban|date of birth|dob|my address|home address|phone number|my email|pan card|my name is)\b/i];
const MATH=/\b(solve|calculate|compute|derivative|integral|equation|algebra|trigonometry|square root|logarithm)\b|\b(?:integrate|differentiate|simplify)\s+(?:the\s+)?(?:function|expression|fraction|\d|x\b)|\d\s*[+*/÷×^]\s*\d|what(?:'s| is)\s+\d+\s*[-x]\s*\d+|\d+\s*(plus|minus|times|divided by|multiplied by)\s*\d+/i;
const TRAVEL=/\b(book(ing)?|reserve|purchase|buy)\b[^.]*\b(flights?|tickets?|hotels?|cab|taxi|bus|trip|airline|visa)\b|\b(flights? (ticket|booking)s?|airlines?|boarding pass)\b/i;
const reply=t=>S.msgs.push({r:'c',t});
function escalate(t){const cr=CRISIS.test(t),mh=/\b(anxi\w+|depress\w+|panic\w*|mental health|therapy|hopeless)\b/i.test(t),md=/\b(medications?|medicines?|pills?|dosage|prescriptions?|painkillers?|steroids?|antibiotics?|supplements?)\b/i.test(t);
 S.run=0;S.hold=1;S.esc=1;S.escCat=cr?'crisis':mh?'mental':md?'med':'body';S.tab='coach';
 reply({crisis:"I'm really sorry you're going through this. You deserve support from a real person, and I'm not the right help for this. If you might be in danger, please contact your local emergency number now or reach out to someone you trust. I've paused training and flagged this for a human.",mental:"Thank you for telling me. What you're feeling matters, and I'm not the right support for it. I've paused training and flagged this for a human who can help.",med:"I can't advise on medication or supplements. A doctor or pharmacist is the right person for that. I've paused training and flagged this for a human.",body:"I'm sorry you're not feeling well. I can't give health advice, so I've paused training and flagged this for a human to follow up. Your plan is on hold, not lost."}[S.escCat]);render()}
function startSolo(){if(S.hold)return toast('Paused until a human has followed up');const p=S.vers[S.commit];if(!p.dur||p.type=='rest'||p.type=='shift')return toast('No workout to start today');S.solo=1;S.left=p.dur*60;S.run=1;S.tab='sync';toast('Solo session started · '+p.dur+' min');speak('Starting your '+p.dur+' minute solo session.');render()}
function endSolo(){S.solo=0;S.run=0;S.left=S.vers[S.commit].dur*60;toast('Session ended');render()}
function commitRoutine(){if(S.rsvpMe)return;S.rsvpMe=1;render();setTimeout(()=>{S.rsvpAlex=1;toast('Alex confirmed '+SLOTS[S.slot][0]+' '+SLOTS[S.slot][1]);if(S.tab=='sync')render()},1600)}
function send(txt){txt=txt.trim();if(!txt)return;
 if(PII.some(r=>r.test(txt)||r.test(norm(txt)))){S.msgs.push({r:'u',t:'🔒 Message withheld (personal info)'});reply("I don't access, collect or store personal or payment information such as card numbers, ID numbers, phone, email, addresses or passwords, so please don't share them here. I've kept that message out of the chat. I can still adapt your workout: tell me your time and energy.");return render()}
 S.msgs.push({r:'u',t:(S.viaVoice?'🎙️ ':'')+txt});
 if(S.onb<2)return onbTyped(txt);
 if(!S.hold&&!S.offline)return askClaude(txt);
 localRoute(txt)}
// Built-in rules engine: used only when Claude (the server) is unavailable or coaching is on hold.
function localRoute(txt){
 if(CRISIS.test(txt)||selfMed(txt))return escalate(txt);
 if(TRAVEL.test(txt)){reply("I can't book travel or tickets. I only help with your training schedule.");return render()}
 if([txt,norm(txt)].some(x=>MATH.test(x))){reply("I don't solve math problems. I'm here to adapt your workouts around your day.");return render()}
 if(S.hold){reply("Coaching is on hold while a human follows up. You can log today as a rest day, or resume once you've been cleared.");return render()}
 const a=analyze(txt);
 if(!a.signal){reply(/^(hi|hello|hey|yo|good (morning|afternoon|evening))\b/i.test(txt)?"Hi! Tell me what your day looks like and I'll adapt your workout.":"I didn't catch a schedule or energy detail, so I haven't changed your plan. Tell me when you'll be free, how many minutes you have, or how you feel, e.g. “home at 9pm, tired” or “I only have 25 min”.");return render()}
 if(S.turns>=3){reply("You've used your 3 free turns. Pick a version above to continue.");return render()}
 const p=propose(a);S.vers.push(p);S.act=S.vers.length-1;S.turns++;reply(p.msg);
 if(S.turns==3)reply("That's your 3 free turns. Compare v0–v3 above and commit the one that fits.");
 if(a.solo&&p.type!='rest'&&p.type!='shift'){commit(S.act);reply('Starting your solo session now: '+p.dur+'-min timer, opening Sync.');return startSolo()}

<div class="card"><div class="sm">Today's Collaborative Goal</div><div class="h" style="margin:2px 0 6px">800 kcal collective output</div><div class="row" style="justify-content:flex-start;gap:14px"><svg viewBox="0 0 100 100" width="86" height="86"><g fill="none" stroke-width="9" stroke-linecap="round" transform="rotate(-90 50 50)">${R(42,me/400,'#7cc4d8')}${R(28,al/400,'#7ee8a8')}</g></svg><div style="font-size:11px;line-height:1.9">You <b>${Math.round(me)}/400</b><br>Alex <b>${Math.round(al)}/400</b><br><span class="sm">${Math.round(me+al)} of 800 kcal</span></div></div></div>
<div class="card"><div class="row"><div class="h">🏅 Consistency Rewards</div><span class="tag">${pts} pts</span></div>
<div class="sm" style="margin:6px 0 8px">${ok?'Unlocked this week: +50 pt bonus for 5+ active days.':`Work out 5+ days a week to unlock +50 pts. You're at ${cnt}/5.`}</div>
<div style="height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${Math.min(100,pts/5)}%;background:var(--mint)"></div></div>
<div class="ex"><span>${ok?'✅':'🔒'} 5+ active days a week</span><span>+50 pts</span></div>
<div class="ex"><span>🔒 3 qualifying weeks in a row</span><span>🏅 ${ok?1:0}/3</span></div>
<div class="ex"><span>${pts>=500?'✅':'🔒'} 500 pts</span><span>Partner reward</span></div>
<div class="sm" style="margin-top:6px">Demo scheme: points are simulated.</div></div>`}

function render(){const v={sync,coach,session,room}[S.tab]();$('view').className='view'+(S.tab=='coach'?' coach':'');$('view').innerHTML=(S.hold&&S.tab!='coach'?'<div class="card" style="border-color:#f59e0b;padding:10px"><div class="row"><span class="sm">⏸ Training is on hold while a human follows up</span><button class="chip" data-t="coach">Support options</button></div></div>':'')+v;
 $('nav').innerHTML=[['sync','📅','Sync'],['coach','💬','Coach'],['session','⏱️','Session'],['room','👥','Room']].map(t=>`<button data-t="${t[0]}" class="${S.tab==t[0]?'on':''}"><span>${t[1]}</span>${t[2]}</button>`).join('');
 const ch=$('view').querySelector('.chat');if(ch)ch.scrollTop=ch.scrollHeight;
 if((S.voice||S.viaVoice)&&S.msgs.length>S.spoken)speak(S.msgs.slice(S.spoken).filter(m=>m.r=='c'&&!m.pending).map(m=>m.t).join(' '),1);S.spoken=S.msgs.length;S.viaVoice=0;const i=$('in');if(i){i.focus();i.onkeydown=e=>{if(e.key=='Enter'){handle(i.value)}};$('sd').onclick=()=>handle(i.value)}}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.t){S.tab=d.t;render()}else if(d.v!=null){S.act=+d.v;render()}else if(d.c!=null)commit(+d.c);
 else if(d.ob&&S.onb<2){const o=OB[S.onb].opts.find(x=>x[0]==d.ob);onbAnswer(o[0],o[1],true)}else if(d.slot!=null){S.slot=+d.slot;S.cday=[1,3,5][S.slot];render()}else if(d.day!=null){S.cday=+d.day;render()}
 else if(b.id=='cr'){commitRoutine()}else if(b.id=='mic'){listen()}else if(b.id=='newtab'){try{window.open(location.href,'_blank')}catch(e){}}else if(d.voice){S.voice^=1;if(S.voice)speak('Voice replies on');render()}else if(d.det){S.planOpen^=1;render()}
 else if(b.id=='go'&&S.left){if(S.hold)return toast('Paused until a human has followed up');S.run^=1;render()}else if(b.id=='end'){endSolo()}else if(d.solo!=null){commit(+d.solo);startSolo()}else if(d.esc){if(d.esc=='req'){S.esc=2;toast('Request sent');reply("Thanks, I've sent your request. A human will follow up here in the app. I'll keep training paused in the meantime.")}else if(d.esc=='rest'){const v=propose({rest:true});S.vers.push(v);S.act=S.vers.length-1;commit(S.act);reply("Done. Today is logged as a rest day and your full session is on your calendar for tomorrow 7:00 AM. Coaching stays on hold until a human follows up.")}else{S.esc=0;S.hold=0;S.escCat='';reply("Welcome back. Tell me about your day, how long you have and how you feel, and I'll adapt your session.")}render()}else if(d.help){escalate('unwell')}});

setInterval(()=>{if(!S.run||!S.left)return;S.left--;S.kcal[0]+=.09;S.kcal[1]+=.085;
 if(!S.left){S.run=0;S.done=1;speak('Set complete. Nice work.');toast('Set complete · streak +1');if(S.tab=='session'||S.tab=='sync')render();return}
 if(S.tab=='sync'){const t2=$('tm2');if(t2){t2.textContent=mmss(S.left);$('pb').style.width=(pct()*100).toFixed(1)+'%';$('kc2').textContent=Math.round(S.kcal[0])}return}
 if(S.tab!='session')return;const t=$('tm');if(!t)return;t.textContent=mmss(S.left);
 if($('b1'))$('b1').textContent=118+Math.round(Math.random()*5);$('b2').textContent=122+Math.round(Math.random()*5);$('kc').textContent=kc();
 [[78,pct()],[64,Math.max(0,pct()-.03)]].forEach(([r,p])=>{const L=2*Math.PI*r;$('rg'+r).setAttribute('stroke-dasharray',(L*p).toFixed(1)+' '+L.toFixed(1))})},1000);
render();
</script>
</body>
